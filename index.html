<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Αττική 2050 • Mobile 3D</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui}body{background:#dce9e3}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:8px;left:8px;right:8px;background:#12312df2;color:white;border-radius:13px;padding:12px;box-shadow:0 3px 14px #0004}h1{font-size:18px;margin:0 0 6px}.buttons{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid #80ad9e;background:#255a50;color:white;padding:9px;border-radius:8px;font-weight:700}button.active{background:#c6ed98;color:#183a30}#status{font-size:12px;margin-top:7px;color:#e4f6de}#diagnostic{font-size:11px;color:#fbd9b4}.legend{position:absolute;z-index:1000;bottom:12px;left:8px;right:8px;pointer-events:none;background:#12312de8;color:white;border-radius:10px;padding:9px;font-size:12px}.maplibregl-ctrl-top-right{top:165px}.leaflet-top{top:165px}</style></head><body><div id="map"></div><div class="panel"><h1>🌳 ΑΤΤΙΚΗ 2050 • 3D / Εφεδρικός χάρτης</h1><div class="buttons"><button data-mode="now" class="active">2026</button><button data-mode="a">2050 Α</button><button data-mode="b">2050 Β</button><button id="tilt">Κλίση 3D</button><button id="reset">Επαναφορά</button></div><div id="status">Εκκίνηση χάρτη…</div><div id="diagnostic"></div></div><div class="legend">🟩 Πράσινοι άξονες • 🟣 Ριζικές ζώνες. Όλες οι προτάσεις είναι <b>σχηματικές</b>, όχι τεχνικές μελέτες. Αν αποτύχει το 3D, ενεργοποιείται αυτόματα δισδιάστατος χάρτης.</div><script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){const center=[23.733,37.933],status=document.getElementById('status'),diag=document.getElementById('diagnostic');let map=null,leaf=null,mode='now',ready=false,startedFallback=false;const lines=[[[23.746,37.928],[23.741,37.925],[23.733,37.922],[23.725,37.921],[23.716,37.919]],[[23.738,37.943],[23.736,37.936],[23.733,37.929],[23.730,37.922]]],polys=[[[23.727,37.935],[23.731,37.935],[23.731,37.932],[23.727,37.932]],[[23.736,37.926],[23.739,37.926],[23.739,37.924],[23.736,37.924]]],points=[[23.728,37.938],[23.740,37.933],[23.722,37.928]];const fc=(coords,type)=>({type:'FeatureCollection',features:coords.map((c,i)=>({type:'Feature',properties:{name:'Ενδεικτική παρέμβαση '+(i+1)},geometry:{type,coordinates:type==='Polygon'?[c.concat([c[0]])]:c}}))});const routes=fc(lines,'LineString'),zones=fc(polys,'Polygon'),parks=fc(points,'Point');let leafLayers=[];function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(map&&ready){for(const [id,show] of [['routes',m!=='now'],['parks',m!=='now'],['zones',m==='b']])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',show?'visible':'none')}if(leaf){leafLayers.forEach(x=>leaf.removeLayer(x));leafLayers=[];if(m!=='now'){lines.forEach(c=>leafLayers.push(L.polyline(c.map(p=>[p[1],p[0]]),{color:'#00a85a',weight:10,opacity:.85}).addTo(leaf)));points.forEach(p=>leafLayers.push(L.circle([p[1],p[0]],{radius:170,color:'#007f40',fillColor:'#39d66c',fillOpacity:.45}).addTo(leaf)))}if(m==='b')polys.forEach(c=>leafLayers.push(L.polygon(c.map(p=>[p[1],p[0]]),{color:'#8b44d9',weight:4,fillOpacity:.45}).addTo(leaf)))}status.textContent=(leaf?'Λειτουργία 2D (εφεδρική)':'Λειτουργία 3D')+' • '+({now:'2026 — σημερινή βάση',a:'2050 Α — πράσινοι διάδρομοι',b:'2050 Β — πρόσθετες ριζικές ζώνες'}[m])}function fallback(reason){if(startedFallback||ready)return;startedFallback=true;diag.textContent='Το 3D δεν φορτώθηκε: '+reason+'. Εμφανίζεται εφεδρικός χάρτης.';try{if(map){map.remove();map=null}document.getElementById('map').innerHTML='';if(!window.L)throw Error('Δεν φορτώθηκε η βιβλιοθήκη Leaflet');leaf=L.map('map',{zoomControl:false}).setView([center[1],center[0]],14);L.control.zoom({position:'bottomright'}).addTo(leaf);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(leaf);setMode(mode)}catch(e){status.textContent='Αδυναμία φόρτωσης διαδικτυακών χαρτών';diag.textContent=e.message+' — απαιτείται HTTPS φιλοξενία ή έλεγχος δικτύου.'}}try{if(!window.maplibregl)throw Error('Η βιβλιοθήκη 3D δεν φορτώθηκε');if(!maplibregl.supported())throw Error('Το WebGL δεν είναι διαθέσιμο');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center,zoom:14.4,pitch:55,bearing:-18,antialias:true});map.on('load',()=>{if(startedFallback)return;ready=true;clearTimeout(timer);try{const style=map.getStyle(),b=style.layers.find(l=>l['source-layer']==='building');if(b){map.addLayer({id:'attiki-3d-buildings',type:'fill-extrusion',source:b.source,'source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':'#b9c5bc','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],9],'fill-extrusion-opacity':.83}})}map.addSource('routes-data',{type:'geojson',data:routes});map.addLayer({id:'routes',type:'line',source:'routes-data',layout:{visibility:'none'},paint:{'line-color':'#05b85e','line-width':12}});map.addSource('parks-data',{type:'geojson',data:parks});map.addLayer({id:'parks',type:'circle',source:'parks-data',layout:{visibility:'none'},paint:{'circle-radius':26,'circle-color':'#31e071','circle-opacity':.75}});map.addSource('zones-data',{type:'geojson',data:zones});map.addLayer({id:'zones',type:'fill-extrusion',source:'zones-data',layout:{visibility:'none'},paint:{'fill-extrusion-color':'#9851d9','fill-extrusion-height':30,'fill-extrusion-opacity':.6}});map.addControl(new maplibregl.NavigationControl(),'bottom-right');setMode(mode)}catch(e){diag.textContent='Σφάλμα επιπέδων: '+e.message;status.textContent='Ο βασικός χάρτης φορτώθηκε'}});map.on('error',e=>{if(!ready)diag.textContent='Προειδοποίηση δικτύου: '+(e.error?.message||'αδυναμία ανάκτησης δεδομένων')});var timer=setTimeout(()=>fallback('υπέρβαση 18 δευτερολέπτων'),18000)}catch(e){fallback(e.message)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('tilt').onclick=()=>{if(map&&ready)map.easeTo({pitch:map.getPitch()>40?10:70,duration:650});else diag.textContent='Η κλίση 3D απαιτεί τη λειτουργία WebGL.'};document.getElementById('reset').onclick=()=>{if(map&&ready)map.flyTo({center,zoom:14.4,pitch:55,bearing:-18});if(leaf)leaf.setView([center[1],center[0]],14)}})();
</script></body></html>
